<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f1f7;background:#0c0a0d;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:#0c0a0d}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:1fr 64px;background:radial-gradient(circle at 9% 12%,rgba(210,137,71,.08),transparent 26%),linear-gradient(135deg,#0b090c,#100d12 55%,#0b090d);overflow:hidden}.stage{display:grid;place-items:center;padding:18px}.slide{width:min(1500px,calc(100vw - 36px));aspect-ratio:16/9;max-height:calc(100vh - 92px);position:relative;overflow:hidden;border:1px solid #2b2530;border-radius:30px;background:#15121a;box-shadow:0 34px 90px rgba(0,0,0,.45);padding:52px 58px 48px}.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:42px 42px;pointer-events:none}.rail{position:absolute;top:20px;left:0;right:0;height:2px;background:#211c25}.rail:after{content:"";display:block;height:100%;width:var(--progress);background:#d88d49}.head{position:absolute;top:8px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;color:#c7beca;font-size:11px;font-weight:700}.head span:last-child{color:#e4a566}.content{height:100%;display:grid;grid-template-columns:1.12fr .88fr;gap:34px;position:relative;z-index:1}.copy{align-self:start;padding-top:26px;min-width:0}.kicker{color:#d58b48;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}.copy h1{font-size:clamp(40px,4.7vw,76px);line-height:.95;letter-spacing:-.035em;margin:0 0 24px;max-width:850px}.copy p{font-size:clamp(15px,1.25vw,22px);line-height:1.5;color:#ddd5e1;max-width:830px;margin:0 0 20px}.bullets{display:grid;gap:9px;margin-top:16px}.bullet{display:flex;gap:12px;align-items:flex-start;color:#e5dee8;font-size:clamp(14px,1.06vw,19px)}.bullet:before{content:"";width:7px;height:7px;border-radius:1px;background:#d88d49;margin-top:.62em;flex:none}.callout{position:absolute;left:58px;bottom:42px;width:min(570px,47%);border:1px solid #59402d;background:#251d1c;border-radius:11px;padding:18px 20px;border-left:4px solid #d88d49;font-weight:800;color:#f0e8eb}.visual{border:1px solid #2d2731;border-radius:26px;min-height:0;align-self:stretch;display:grid;place-items:center;background:#100e14;position:relative;overflow:hidden}.rings{width:74%;aspect-ratio:1;border:1px solid #5b3829;border-radius:50%;display:grid;place-items:center;position:relative}.rings:before,.rings:after{content:"";position:absolute;border:1px solid #5b3829;border-radius:50%}.rings:before{inset:17%}.rings:after{inset:34%}.ring-label{position:relative;z-index:2;border:1px solid #5e4536;background:#151116;border-radius:12px;padding:18px 20px;font-size:clamp(20px,2vw,34px);font-weight:900;line-height:1;text-align:center;max-width:76%}.orbit{position:absolute;font-size:9px;font-weight:900;text-transform:uppercase;border:1px solid #312a34;background:#0d0b10;border-radius:999px;padding:5px 10px}.o1{top:12%;left:8%}.o2{top:22%;right:4%}.o3{bottom:12%;left:12%}.o4{bottom:18%;right:8%}.cards{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}.card{border:1px solid #483737;background:#211c24;border-radius:18px;padding:18px;display:grid;align-content:start;gap:5px}.card:nth-child(2n){background:#211c27}.card strong{font-size:clamp(18px,1.55vw,27px)}.card span{font-size:clamp(12px,.95vw,17px);line-height:1.4;color:#cfc5d2}.stack{width:88%;display:grid;gap:9px}.stack div{border:1px solid #5a3c2d;background:#241b1b;border-radius:9px;padding:11px 14px;font-size:clamp(12px,.95vw,17px);font-weight:800}.flow{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:24px}.flow .node{border:1px solid #61412f;background:#2a201e;border-radius:10px;padding:11px 13px;font-weight:800;font-size:clamp(10px,.8vw,15px);text-align:center}.flow .arrow{color:#d88d49;font-weight:900}.code{width:88%;border:1px solid #2c2730;border-radius:13px;background:#0b0910;padding:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8c19a;line-height:1.7;white-space:pre-wrap}.controls{display:grid;grid-template-columns:160px 1fr 160px;align-items:center;padding:0 22px 12px;gap:10px}.controls button{border:1px solid #342d38;background:#17131c;color:#eee7f0;border-radius:12px;padding:10px 14px;cursor:pointer}.controls button:disabled{opacity:.25;cursor:default}.controls button:last-child{justify-self:end}.dots{display:flex;justify-content:center;gap:7px}.dots button{width:8px;height:8px;border:0;padding:0;border-radius:99px;background:#514654}.dots button.active{width:26px;background:#d88d49}.tagline{font-size:13px;color:#a99fab;text-align:center}.four{grid-template-columns:1fr 1fr}.four .card{min-height:140px}@media(max-width:900px){.app{overflow:auto}.stage{padding:8px}.slide{width:100%;max-height:none;aspect-ratio:auto;min-height:760px;padding:46px 26px 80px}.content{grid-template-columns:1fr}.visual{min-height:320px}.callout{left:26px;bottom:24px;width:calc(100% - 52px)}.controls{position:sticky;bottom:0;background:#0c0a0de8}.copy h1{font-size:42px}}
</style>
</head>
<body><main class="app"><section class="stage"><article class="slide" id="slide"></article></section><footer class="controls"><button id="prev">← Anterior</button><div><div class="dots" id="dots"></div><div class="tagline">Clase recuperada desde el PDF existente · 11 diapositivas</div></div><button id="next">Siguiente →</button></footer></main>
<script>
const slides=[
{section:'INGENIERÍA DE SOFTWARE',title:'Git, GitHub, HTML y CSS',p:['Fundamentos web, control de versiones y publicación de un proyecto moderno.','La clase conecta la construcción de una interfaz web con la necesidad de guardar historia, colaborar y publicar cambios de forma controlada.'],callout:'Código + historia + colaboración + publicación.',visual:'rings',ring:'GIT, GITHUB, HTML Y CSS'},
{section:'WEB',title:'HTML: estructura y semántica',p:['HTML define la estructura del documento. Una estructura semántica facilita lectura, accesibilidad, mantenimiento y comprensión del código.'],visual:'cards',cards:[['header','Cabecera o encabezado de una sección.'],['main','Contenido principal de la página.'],['section','Agrupa contenido relacionado.'],['footer','Información de cierre o pie.']]},
{section:'WEB',title:'CSS: presentación y composición',p:['CSS controla cómo se ve la estructura HTML: tipografía, color, espaciado, tamaño y disposición.'],bullets:['Cascada y especificidad.','Box model.','Flexbox para distribución en una dimensión.','Grid para estructuras bidimensionales.','Responsive design para adaptar la interfaz.'],visual:'rings',ring:'CSS: PRESENTACIÓN Y COMPOSICIÓN'},
{section:'WEB',title:'Separar estructura, estilo y comportamiento',p:['Separar responsabilidades facilita mantener y evolucionar el proyecto.'],callout:'Separar responsabilidades facilita mantener y evolucionar el proyecto.',visual:'flow',flow:['HTML - estructura','CSS - presentación','JavaScript - comportamiento']},
{section:'CONTROL DE VERSIONES',title:'¿Qué problema resuelve Git?',p:['Git es un sistema de control de versiones distribuido. Guarda la historia de cambios, permite trabajar con ramas, comparar versiones y recuperar estados anteriores.'],visual:'cards',cards:[['Repositorio','Proyecto más historial de cambios.'],['Commit','Punto coherente de la historia con un mensaje.'],['Branch','Línea de trabajo independiente.']]},
{section:'GIT',title:'El ciclo básico de trabajo',p:['Los commits pequeños y enfocados hacen que el historial sea más útil y que los cambios sean más fáciles de revisar.'],visual:'flow',flow:['git status','git add','git commit','git push','Pull Request']},
{section:'GITHUB',title:'GitHub es más que alojamiento',bullets:['Repositorios remotos.','Issues para tareas e incidencias.','Pull Requests para proponer cambios.','Code Review para revisar antes de integrar.','Actions para automatización y CI/CD.'],visual:'rings',ring:'GITHUB ES MÁS QUE ALOJAMIENTO'},
{section:'COLABORACIÓN',title:'Ramas, Pull Requests y main estable',p:['La rama principal debería representar un estado confiable del proyecto.'],callout:'La rama principal debería representar un estado confiable del proyecto.',visual:'stack',flow:['Crear rama','Hacer cambios','Commit','Push','Pull Request','Review','Merge']},
{section:'PROYECTO',title:'.gitignore y archivos que no deben versionarse',p:['No todo archivo del entorno local debe formar parte del repositorio.'],visual:'code',code:'.gitignore\n\nnode_modules/\ndist/\n.env\n.DS_Store',ring:'GITIGNORE'},
{section:'PUBLICACIÓN',title:'De GitHub a una URL pública',p:['Publicar permite comprobar que el proyecto funciona fuera de la computadora de desarrollo.'],visual:'flow',flow:['Proyecto local','Repositorio GitHub','Build','Vercel /','Sitio publicado']},
{section:'CIERRE',title:'Ideas principales',bullets:['HTML estructura.','CSS presenta.','Git controla cambios.','GitHub facilita colaboración.','Un flujo con ramas y PRs reduce riesgos.','Publicar permite validar el proyecto en un entorno real.'],visual:'rings',ring:'IDEAS PRINCIPALES'}
];
let i=0;const el=document.querySelector('#slide'),dots=document.querySelector('#dots'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
function visual(s){if(s.visual==='cards')return `<div class="visual"><div class="cards ${s.cards?.length===4?'four':''}">${s.cards.map(x=>`<div class="card"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></div>`;if(s.visual==='flow')return `<div class="visual"><div class="flow">${s.flow.map((x,n)=>`${n?'<span class="arrow">→</span>':''}<span class="node">${x}</span>`).join('')}</div></div>`;if(s.visual==='stack')return `<div class="visual"><div class="stack">${s.flow.map(x=>`<div>${x}</div>`).join('')}</div></div>`;if(s.visual==='code')return `<div class="visual"><pre class="code">${s.code}</pre></div>`;return `<div class="visual"><div class="rings"><span class="orbit o1">Concepto</span><span class="orbit o2">Práctica</span><span class="orbit o3">Flujo</span><span class="orbit o4">Calidad</span><div class="ring-label">${s.ring}</div></div></div>`}
function render(){const s=slides[i];el.style.setProperty('--progress',`${((i+1)/slides.length)*100}%`);el.innerHTML=`<div class="rail"></div><div class="head"><span>Git, GitHub, HTML y CSS</span><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></div><div class="content"><div class="copy"><div class="kicker">${s.section}</div><h1>${s.title}</h1>${(s.p||[]).map(x=>`<p>${x}</p>`).join('')}${s.bullets?`<div class="bullets">${s.bullets.map(x=>`<div class="bullet">${x}</div>`).join('')}</div>`:''}</div>${visual(s)}</div>${s.callout?`<div class="callout">${s.callout}</div>`:''}`;prev.disabled=i===0;next.disabled=i===slides.length-1;dots.innerHTML=slides.map((_,n)=>`<button aria-label="Diapositiva ${n+1}" class="${n===i?'active':''}" data-i="${n}"></button>`).join('');dots.querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;render()})}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<slides.length-1){i++;render()}};addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next.click()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev.click()}if(e.key==='Home'){i=0;render()}if(e.key==='End'){i=slides.length-1;render()}});render();
</script></body></html>
